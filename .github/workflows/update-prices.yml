name: CI و به‌روزرسانی نرخ‌ها

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # هر ۳۰ دقیقه (به زمان UTC) — نرخ‌ها را تازه می‌کند
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-update:
    name: تست و به‌روزرسانی نرخ‌ها
    runs-on: ubuntu-latest
    env:
      BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: اجرای تست‌ها
        run: npm test

      - name: دریافت نرخ‌های تازه
        if: env.BRSAPI_KEY != ''
        run: node tools/update-prices.js --out data/latest.json
        continue-on-error: true

      - name: هشدار دربارهٔ نبود کلید
        if: env.BRSAPI_KEY == ''
        run: |
          echo "::warning::متغیر BRSAPI_KEY در Secrets تنظیم نشده؛ data/latest.json به‌روزرسانی نشد."
          echo "برای فعال‌سازی به‌روزرسانی خودکار:"
          echo "  1) از https://brsapi.ir/tsetmc-exchange-free-bourse-api-key-request/ کلید رایگان بگیرید"
          echo "  2) در Settings → Secrets and variables → Actions یک secret به نام BRSAPI_KEY بسازید"

      - name: ثبت نرخ‌های تازه در مخزن
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "تغییری در نرخ‌ها نبود."
          else
            git commit -m "chore: به‌روزرسانی نرخ‌ها — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
