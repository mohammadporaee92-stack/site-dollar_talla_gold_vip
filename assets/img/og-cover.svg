  <path d="M90 470 L240 430 L390 452 L540 388 L690 410 L840 330 L990 352 L1120 268 L1120 560 L90 560 Z" fill="url(#fade)"/>
  <path d="M90 470 L240 430 L390 452 L540 388 L690 410 L840 330 L990 352 L1120 268" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
